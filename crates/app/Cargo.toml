[package]
name = "transmute"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "transmute"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
drag = "2.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png", "protocol-asset", "tray-icon"] }
transmute-core = { path = "../core" }
transmute-gesture = { path = "../gesture" }
windows-collections = "0.3"
windows-core = "0.62"
windows-future = "0.3"

[dependencies.windows]
version = "0.62.2"
features = [
    "ApplicationModel_DataTransfer",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media",
    "Media_FaceAnalysis",
    "Media_Ocr",
    "Storage",
    "Storage_Search",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]
